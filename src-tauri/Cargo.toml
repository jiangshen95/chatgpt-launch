[package]
name = "chatgpt-launcher"
version = "0.1.0"
description = "Cross-platform ChatGPT desktop launcher with per-profile proxy / timezone / language"
authors = ["you"]
edition = "2021"

[lib]
name = "chatgpt_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chatgpt-launcher-core = { path = "../core" }
